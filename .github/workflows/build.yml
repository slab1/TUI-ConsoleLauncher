name: Build TUI APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_COMPILE_SDK: "34"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Explicitly install required build-tools and platform versions
      - name: Install specific Android SDK components
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_COMPILE_SDK }}"
          sdkmanager --install "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Generate consistent debug keystore (cached for consistent signing)
      - name: Generate or use cached debug keystore
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Using existing debug keystore"
          else
            echo "Generating new debug keystore"
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          echo "Keystore fingerprint:"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass android 2>&1 | grep -E "SHA256:|MD5:|SHA1:" | head -3

      # Cache the debug keystore for future builds
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Clean build
        run: ./gradlew clean

      - name: Build F-Droid Debug APK
        run: ./gradlew assembleFdroidDebug --no-daemon

      - name: APK verification
        run: |
          echo "=== APK Files ==="
          find app/build/outputs -name "*.apk" -ls
          echo ""
          echo "=== SHA-256 Checksums ==="
          sha256sum app/build/outputs/apk/fdroid/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TUI-ConsoleLauncher-APK
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
