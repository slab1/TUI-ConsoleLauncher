name: Build TUI APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build PlayStore Debug APK
        run: ./gradlew assemblePlaystoreDebug

      - name: Build F-Droid Debug APK
        run: ./gradlew assembleFdroidDebug

      - name: Upload PlayStore APK
        uses: actions/upload-artifact@v4
        with:
          name: TUI-PlayStore-Debug
          path: app/build/outputs/apk/playstore/debug/*.apk

      - name: Upload F-Droid APK
        uses: actions/upload-artifact@v4
        with:
          name: TUI-FDroid-Debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
