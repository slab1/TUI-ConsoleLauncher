name: Build TUI APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_COMPILE_SDK: "34"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install specific Android SDK components
        run: |
          sdkmanager --install "platforms;android-${{ env.ANDROID_COMPILE_SDK }}"
          sdkmanager --install "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate or use cached debug keystore
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Using existing debug keystore"
          else
            echo "Generating new debug keystore"
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build F-Droid Debug APK
        run: ./gradlew assembleFdroidDebug --no-daemon

      - name: Compute checksum
        run: |
          echo "=== SHA-256 ==="
          sha256sum app/build/outputs/apk/fdroid/debug/*.apk
          echo "APK_NAME=$(basename app/build/outputs/apk/fdroid/debug/*.apk)" >> $GITHUB_ENV

      - name: Upload APK as Release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/fdroid/debug/*.apk | head -1)
          echo "Uploading: $APK"
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly \
            --title "TUI Nightly Build" \
            --notes "Latest build from master @ $(date -u)" \
            --target "${{ github.sha }}" \
            --latest=false
          gh release upload nightly "$APK" --clobber
          echo "APK uploaded to: https://github.com/${{ github.repository }}/releases/tag/nightly"
